[tools]
bun = "1.4.3"
uv = "0.13.1"

[tasks.dev]
description = "Run the map dev server with dev fixture data (http://localhost:3000)"
dir = "front"
run = "bun run dev"

[tasks.build]
description = "Build the map for production into front/dist"
dir = "front"
run = "bun run build"

[tasks.ci]
description = "Lint, type-check, test and build the map; lint the data pipeline"
run = [
  "cd front && bun run ci",
  "cd data && uv run ruff check . && uv run ruff format --check . && uv run pytest -q",
]

[tasks.data]
description = "Regenerate data/prod airports, routes and airlines from the airline APIs (~5 min); review git diff before committing"
dir = "data"
run = "uv run python build.py"

[tasks.fares]
description = "Pre-fetch Wizz Air fare calendars (next 12 weeks) into data/prod/fares-W6.json (~1.5 h at one request a second; re-run the same day to resume); Ryanair fares are fetched live by the map"
dir = "data"
run = "uv run python fares.py"
