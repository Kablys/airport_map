[project]
name = "data"
version = "0.1.0"
description = "Data pipeline for the Ryanair airport map: fetches airports and routes into prod/*.json, plus Wikidata exploration and a Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "marimo>=0.14.16",
    "polars>=1.32.2",
    "streamlit>=1.39.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.8",
    "ty>=0.0.1a17",
    "watchdog>=6.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ty.environment]
extra-paths = ["wikidata"]
